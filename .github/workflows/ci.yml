name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Unit and race tests
        run: go test -race -count=1 ./...
      - name: Cross-platform builds
        run: |
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

  # Rootless is the default mode: run as the unprivileged runner user with
  # no sudo or setcap. Ubuntu's AppArmor restriction on unprivileged user
  # namespaces is a kernel policy switch, lifted before the tests start.
  linux-rootless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Allow unprivileged user namespaces and verify TUN
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ ! -c /dev/net/tun ]; then sudo modprobe tun; fi
          test -c /dev/net/tun
      - name: Rootless namespace, lifecycle and failure tests
        run: |
          test "$(id -u)" != 0
          SESSIONNET_REQUIRE_ROOTLESS=1 go test -count=1 -v ./...
      - name: Rootless setup benchmarks
        run: go test -run '^$' -bench 'BenchmarkSession' -benchtime=50x .

  linux-rootful:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify TUN availability
        run: |
          if [ ! -c /dev/net/tun ]; then sudo modprobe tun; fi
          test -c /dev/net/tun
      - name: Rootful mode as root
        run: |
          go test -c -o /tmp/sessionnet-integration.test .
          sudo /tmp/sessionnet-integration.test -test.v -test.run 'TestRootfulModeAsRoot'
      - name: Verify cgroup v2 containment and crash recovery
        run: |
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          sudo mkdir -p /sys/fs/cgroup/sessionnet-test
          sudo SESSIONNET_CGROUP_TEST_ROOT=/sys/fs/cgroup/sessionnet-test /tmp/sessionnet-integration.test -test.v -test.run 'TestLinuxCgroup'
          sudo rmdir /sys/fs/cgroup/sessionnet-test
